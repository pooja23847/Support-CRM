<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Support CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

  <div class="max-w-sm w-full p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">Create Company Account</h1>
    <p class="text-sm text-gray-500 mb-6">Sign up your team to start managing support tickets.</p>

    <form id="signupForm" class="bg-white rounded-lg shadow p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Company Name</label>
        <input type="text" id="company_name" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
      </div>

      <p id="signupError" class="text-red-600 text-sm hidden"></p>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
        Sign Up
      </button>

      <p class="text-sm text-gray-500 text-center">
        Already have an account? <a href="/login" class="text-blue-600">Log in</a>
      </p>
    </form>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
