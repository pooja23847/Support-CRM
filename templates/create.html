<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Ticket — Support CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <div class="max-w-lg mx-auto p-6">
    <a href="/" class="text-blue-600 text-sm">&larr; Back to tickets</a>
    <h1 class="text-2xl font-bold text-gray-800 mt-2 mb-6">Create New Ticket</h1>

    <form id="createForm" class="bg-white rounded-lg shadow p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Customer Name</label>
        <input type="text" id="customer_name" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Customer Email</label>
        <input type="email" id="customer_email" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Issue Title</label>
        <input type="text" id="subject" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea id="description" required rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
        <select id="priority" class="w-full border border-gray-300 rounded-lg px-3 py-2">
           <option value="Low">Low</option>
           <option value="Medium" selected>Medium</option>
           <option value="High">High</option>
        </select>
      </div>

      <p id="formError" class="text-red-600 text-sm hidden"></p>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
        Create Ticket
      </button>
    </form>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
